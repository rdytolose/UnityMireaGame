server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the static site. `$uri.html` lets /pair resolve to pair.html so the
    # QR link (/pair?code=...) works without the .html extension.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Proxy API calls to the backend container so the browser uses the same
    # origin (no CORS needed). "backend" is the service name in docker-compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
