<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат — Cashier &amp; Doom</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: block; padding: 0; }
    .chat { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .chat-head { padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
                 display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 2; }
    .chat-head .ava { width: 40px; height: 40px; border-radius: 50%; background: var(--panel-2);
                      display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .chat-head b { font-size: 16px; }
    .chat-head .st { color: var(--ok); font-size: 12px; }
    .feed { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .bubble { max-width: 80%; padding: 9px 12px; border-radius: 0; font-size: 18px; line-height: 1.3;
              border: 2px solid var(--border); animation: pop .12s steps(2); word-wrap: break-word; }
    .bubble.them { align-self: flex-start; background: var(--panel-2); }
    .bubble.them::before { content: "> "; color: var(--muted); }
    .bubble.me { align-self: flex-end; background: var(--text); color: #000; }
    .bubble.me::before { content: "$ "; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    .answers { padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 8px;
               position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); }
    .answers button { width: 100%; }
    .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 6px; }
  </style>
</head>
<body>
  <div class="chat">
    <div class="chat-head">
      <div class="ava">🧑</div>
      <div><b id="who">Пацан</b><br/><span class="st">в сети</span></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="answers" id="answers"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Текст диалога теперь редактируется в АДМИНКЕ (/admin.html) и тянется с бэка.
    // key берётся из URL: story.html?key=intro (после линка) | ?key=doom_to_shop (переход).
    const KEY = getQueryParam("key") || "intro";
    const WHO = "Пацан";

    const $ = (id) => document.getElementById(id);
    let i = 0;
    let STORY = [];       // узлы диалога (с бэка)
    let mathQueue = [];   // арифметические вопросы из пула (для маркеров "MATH")

    // Без токена тут делать нечего — на главную.
    if (!getToken()) location.href = "index.html";
    $("who").textContent = WHO;

    function bubble(text, cls) {
      const b = document.createElement("div");
      b.className = "bubble " + cls;
      b.textContent = text;
      $("feed").appendChild(b);
      b.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function setAnswers(labels, onPick) {
      $("answers").innerHTML = "";
      labels.forEach(lbl => {
        const btn = document.createElement("button");
        btn.className = "primary";
        btn.textContent = lbl;
        btn.onclick = () => onPick(lbl);
        $("answers").appendChild(btn);
      });
    }

    function typeThen(cb) {
      $("answers").innerHTML = "";
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "печатает…";
      $("feed").appendChild(typing);
      typing.scrollIntoView({ behavior: "smooth", block: "end" });
      setTimeout(() => { typing.remove(); cb(); }, 550);
    }

    function showNode() {
      if (i >= STORY.length) { finish(); return; }
      let node = STORY[i];

      // Маркер "MATH" → подставляем арифметический вопрос из очереди.
      if (node === "MATH") {
        if (mathQueue.length === 0) { i++; showNode(); return; }  // пул кончился — пропускаем
        const q = mathQueue.shift();
        typeThen(() => {
          bubble(q.text, "them");
          setAnswers((q.options || []).map(String), () => advance());
        });
        return;
      }

      // Обычная реплика пацана.
      typeThen(() => {
        bubble(node.text, "them");
        setAnswers(node.a || ["Дальше"], (ans) => advance(ans));
      });
    }

    function advance(chosenLabel) {
      if (chosenLabel) bubble(chosenLabel, "me");  // твой выбор (ни на что не влияет)
      $("answers").innerHTML = "";
      i++;
      setTimeout(showNode, 350);
    }

    async function finish() {
      $("answers").innerHTML = "";
      // Сообщаем бэку: диалог пройден → игра грузит следующую сцену (doom или shop).
      try { await Dialogue.gateDone(); } catch (_) {}
      const btn = document.createElement("button");
      btn.className = "primary";
      btn.textContent = "В игру";
      btn.onclick = () => leave();
      $("answers").appendChild(btn);
      leave();
    }

    // Уходим со страницы, как только игра сменит сцену (экран != talk).
    async function leave() {
      for (let n = 0; n < 30; n++) {            // ~30с максимум
        try {
          const r = await State.getScreen();
          if (r.screen && r.screen !== "talk") { window.location.href = pageForScreen(r.screen); return; }
        } catch (_) {}
        await new Promise(res => setTimeout(res, 1000));
      }
      goToCurrentScreen();
    }

    // Тянем текст диалога (из админки) + арифметику, затем запускаем.
    (async () => {
      try {
        const d = await Dialogue.get(KEY);
        STORY = (d && d.nodes) ? d.nodes : [];
      } catch (_) { STORY = []; }
      try {
        const r = await Dialogue.questions();
        mathQueue = (r && r.questions) ? r.questions : [];
      } catch (_) { mathQueue = []; }
      if (STORY.length === 0) { finish(); return; }  // пустой диалог — сразу дальше
      showNode();
    })();
  </script>
</body>
</html>
