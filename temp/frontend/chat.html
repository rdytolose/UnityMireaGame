<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Связь — Cashier &amp; Doom</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card wide">
    <div class="logo">
      <pre class="ascii">   .-"""-.
  / .---. \
  | |o o| |
  \  \^/  /
   '-...-'</pre>
      <h1>На <span>связи</span></h1>
      <p><span class="live-dot"></span>Реши пример, чтобы прикрыть его</p>
    </div>

    <div class="chat-window" id="chat"></div>
    <div class="question" id="question" style="font-size:2em;text-align:center;margin:14px 0;font-weight:800;"></div>
    <div class="choices" id="choices"></div>
    <div class="msg" id="msg"></div>

    <a class="backlink" href="index.html">← На главную</a>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let shownId = 0;
    let answering = false;

    function setMsg(text, kind) {
      $("msg").textContent = text || "";
      $("msg").className = "msg" + (kind ? " " + kind : "");
    }

    function showWaiting() {
      $("question").textContent = "";
      $("choices").innerHTML = '<p class="muted center">Ждём вопрос от неё…</p>';
    }

    function renderQuestion(q) {
      shownId = q.id;
      answering = false;
      setMsg("");
      $("question").textContent = q.text;
      $("choices").innerHTML = "";
      (q.options || []).forEach((opt) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => pick(q.id, opt);
        $("choices").appendChild(btn);
      });
    }

    async function pick(id, choice) {
      if (answering) return;
      answering = true;
      try {
        const r = await Chat.answer(id, choice);
        setMsg(r.correct ? "✓ Верно! Прикрыл." : "✗ Мимо! Тебя задели.", r.correct ? "ok" : "err");
        $("choices").innerHTML = "";
        $("question").textContent = "";
      } catch (e) { setMsg(e.message, "err"); answering = false; }
    }

    async function poll() {
      try {
        const q = await Chat.getQuestion();
        if (q.status === "pending" && q.id && q.id !== shownId) {
          renderQuestion(q);
        } else if (q.status !== "pending" && shownId !== 0 && q.id === shownId) {
          shownId = 0;
        } else if (q.status !== "pending" && !$("choices").hasChildNodes()) {
          showWaiting();
        }
      } catch (e) {  }
    }

    if (requireAuth()) {
      showWaiting();
      poll();
      setInterval(poll, 1000);
      startScreenWatcher("chat");
    }
  </script>
</body>
</html>
