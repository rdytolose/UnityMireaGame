name: Build & Deploy

# При пуше в main:
#  1) определяем, что изменилось (backend / frontend / compose);
#  2) собираем и пушим в GHCR ТОЛЬКО изменившийся образ;
#  3) деплоим на сервер, если что-то собралось или менялся docker-compose.
# Ручной запуск (workflow_dispatch) пересобирает и деплоит всё принудительно.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_BASE: ghcr.io/rdytolose/unitymireagame

jobs:
  # ── Шаг 1: что изменилось ───────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'temp/backend/**'
            frontend:
              - 'temp/frontend/**'
            compose:
              - 'temp/docker-compose.yml'

  # ── Шаг 2a: собрать backend (только если менялся) ───────────────
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: temp/backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:latest
            ${{ env.IMAGE_BASE }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Шаг 2b: собрать frontend (только если менялся) ──────────────
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: temp/frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:latest
            ${{ env.IMAGE_BASE }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Шаг 3: деплой ───────────────────────────────────────────────
  # Запускается, если что-то собралось или менялся compose. always() нужен,
  # потому что часть build-* джоб может быть пропущена (skipped) — это норма.
  deploy:
    needs: [ changes, build-backend, build-frontend ]
    if: >-
      always() &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.compose == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git reset --hard origin/main
            cd temp
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
